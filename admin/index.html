<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GamifyDeals Admin</title>
  <link rel="stylesheet" href="/admin/admin.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e63946'/><text y='.9em' font-size='70' x='15'>🎮</text></svg>"/>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <img src="/logo.png" alt="GamifyDeals" onerror="this.style.display='none'"/>
      <h1>Gamify<em>Deals</em></h1>
    </div>
    <div class="login-box">
      <h2>Admin Login</h2>
      <p>Sign in to manage your game store</p>
      <div class="login-err" id="loginErr"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" id="loginUser" placeholder="admin" required autocomplete="username"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display:none;">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="/logo.png" alt="GamifyDeals" onerror="this.style.display='none'"/>
      <div class="sidebar-logo-text">
        Gamify<em>Deals</em>
        <small>Admin Panel</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <div class="nav-item active" data-section="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </div>

      <div class="nav-section-label">Store</div>
      <div class="nav-item" data-section="games">
        <span class="nav-icon">🎮</span> Games
      </div>
      <div class="nav-item" data-section="inventory">
        <span class="nav-icon">📦</span> Inventory
      </div>
      <div class="nav-item" data-section="orders">
        <span class="nav-icon">🛒</span> Orders
        <span class="nav-badge" id="pendingBadge" style="display:none">0</span>
      </div>

      <div class="nav-section-label">Logs</div>
      <div class="nav-item" data-section="audit">
        <span class="nav-icon">📋</span> Audit Log
      </div>

      <div class="nav-section-label">Account</div>
      <div class="nav-item" data-section="team" id="teamNavItem" style="display:none">
        <span class="nav-icon">👥</span> Team
      </div>
      <div class="nav-item" data-section="settings">
        <span class="nav-icon">⚙️</span> Settings
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-chip">
        <div class="admin-avatar" id="adminAvatar">A</div>
        <div class="admin-info">
          <div class="name" id="adminNameSidebar">Admin</div>
          <div class="role" id="adminRoleSidebar">admin</div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Sign out">⏻</button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div class="content" id="mainContent">
      <div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL CONTAINER -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Modal</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
